name: Android build and unit tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "Prismal/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradlew"
      - ".github/workflows/android-check.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Prismal/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradlew"
      - ".github/workflows/android-check.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36 for CI compatibility build
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew -PmelaanCompileSdk=36 :app:testDebugUnitTest :app:assembleDebug --console=plain
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Melaan-debug-api36-compatibility
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
